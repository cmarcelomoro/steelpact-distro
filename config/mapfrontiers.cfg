# Configuration file

general {
    # If true, only server operators can create frontiers. [default: false]
    B:opOnly=false
}


limits {
    # If false, new frontiers may not overlap existing ones in the same dimension. [default: false]
    B:allowOverlap=false

    # Maximum chunks a chunk frontier may claim. [range: 1 ~ 4096, default: 128]
    I:maxChunksPerFrontier=128

    # Absolute coordinate limit for frontier points. [range: 1024 ~ 29999984, default: 29999984]
    I:maxCoordinate=29999984

    # Maximum frontiers a single player may own. Operators are exempt. [range: 1 ~ 1000, default: 12]
    I:maxFrontiersPerPlayer=12

    # Maximum frontier name length. [range: 1 ~ 256, default: 48]
    I:maxNameLength=48

    # Maximum vertices a polygon frontier may have. [range: 3 ~ 256, default: 64]
    I:maxPolygonPoints=64

    # Maximum size of a polygon frontier along one axis, in blocks. [range: 256 ~ 29999984, default: 2048]
    I:maxPolygonSpanBlocks=2048
}


maxchunkarearatio {
    # Maximum ratio between a polygon frontier's area (blocks) and the area of the chunks it claims (chunks * 256). Higher lets a frontier of few chunks sprawl further.
    S:limits=8.0
}


maxchunkbboxratio {
    # Maximum ratio between the polygon frontier's own bounding box and the bounding box of the chunks it claims, on each axis. Prevents long thin tails that extend far beyond the chunks they pay for.
    S:limits=2.0
}


maxfrontierarea {
    # Maximum area of a frontier, in square blocks.
    I:limits=2000000
}



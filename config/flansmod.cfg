}


"projectile chunk loading (server)" {
    # Client visibility only; restart required. Larger values increase bandwidth and do not load chunks. [range: 64 ~ 2048, default: 256]
    I:"Bullet tracking range"=256

    # Master switch. Only ammo with ProjectileChunkLoading true may request a ticket. [default: false]
    B:Enable=false

    # Swept current/next corridor; never a 3x3 area. [range: 1 ~ 4, default: 2]
    I:"Forced chunks per projectile"=2

    # Maximum distance from launch position in blocks. [range: 16 ~ 8192, default: 4096]
    I:"Max loaded distance"=4096

    # Ticket lifetime. Existing projectile fuse/lifetime limits still apply. [range: 1 ~ 2400, default: 600]
    I:"Max loaded ticks"=600

    # Authoritative per-dimension ticket cap. [range: 1 ~ 32, default: 32]
    I:"Max tickets per dimension"=32

    # Authoritative simultaneous BVR rounds per player. [range: 1 ~ 4, default: 4]
    I:"Max tickets per player"=4

    # Authoritative server-wide ticket cap. [range: 1 ~ 64, default: 64]
    I:"Max tickets per server"=64
}



# Configuration file

"client performance safeguards" {
    # Freeze client-side fancy track animation and render all links through one display list when FPS is low. Server movement and track damage are unchanged. [default: true]
    B:"Enable low-FPS fancy track batching"=true

    # Render-only fallback. Entity ticking, collision, guidance and server hit registration are never skipped. [default: false]
    B:"Enable low-FPS projectile visual culling"=false

    # Activate the frozen/batched fancy-track fallback at or below this sampled FPS. [range: 10 ~ 120, default: 30]
    I:"Fancy track batching FPS"=30

    # Return to animated fancy tracks at or above this sampled FPS. Keep it higher than the activation threshold to prevent rapid toggling. [range: 10 ~ 120, default: 35]
    I:"Fancy track batching resume FPS"=35

    # Beyond this client distance, animated track links use the cached static track shell. Set 0 to keep full detail everywhere. [range: 0.0 ~ 512.0, default: 64.0]
    S:"Fancy track detail distance"=64.0

    # Begin hiding a deterministic fraction of non-critical projectile models below this sampled FPS. [range: 10 ~ 120, default: 30]
    I:"Projectile culling FPS"=30

    # Hide more non-critical projectile models below this sampled FPS. Must be lower than the culling threshold. [range: 5 ~ 60, default: 20]
    I:"Projectile emergency FPS"=20
}


"gameplay settings (synced)" {
    I:ArmourEnchantability=0

    # The rate of Zombie or Skeleton to spawn equipped with armor. [0=0%, 100=100%] [range: 0 ~ 100, default: 20]
    I:ArmourSpawnRate=20
    S:"Default ADS Spread Modifier"=0.2
    S:"Default ADS Spread Modifier (Shotguns)"=0.8
    B:DisableSprintHipFireByDefault=false
    B:"Driveable hitboxes"=true

    # Range in blocks for vehicles and planes to be updated. [range: 0.0 ~ 1000.0, default: 450.0]
    S:"Driveable update range"=400.0

    # Global server-side switch for destroyed driveable wreck entities. If false, LeaveWreck in vehicle configs is ignored. [default: true]
    B:"Enable Driveable Wrecks"=true
    B:"Enable Gun Dev Mode"=false

    # Replace the legacy blindness flash with accumulating near-miss suppression. [default: false]
    B:"Enable Modern Suppression"=false

    # Enable bullet gui default=true [default: true]
    B:"Enable bullet HUD"=true
    B:"Enable crosshairs"=false
    B:"Enable downward movement of the sight after shot"=true

    #  [default: true]
    B:"Enable hitmarkers"=true
    B:"Enable realistic recoil"=false
    B:"Flashes when player wounded (Synced)"=true

    # Whether or not to add the extra gunpowder recipe (3 charcoal + 1 lightstone) [default: true]
    B:"Gunpowder Recipe"=true
    B:GunsInDeadPartsStillWork=false

    # Wether to kick clients connected to a dedicated server with non-identical packs. [default: false]
    B:KickNonMatchingHashes=true
    B:"Muzzle Flash Particles Default"=true
    B:"Reload on right click"=true
    B:"Seat Collisions"=true

    # List distance between killer and killed in kill message. [default: true]
    B:ShowDistanceInKillMessage=true
    B:UseNewPenetrationSystem=false
    I:breakableArmor=0
    I:defaultArmorDurability=500

    # Enable killMessage display [default: true]
    B:enableKillMessages=true

    # Set the soft carry limit for guns(2-9) [range: 2 ~ 9, default: 3]
    I:gunCarryLimit=3

    # Enable a soft limit to hotbar weapons, applies slowness++ when >= limit [default: false]
    B:gunCarryLimitEnable=false
}


